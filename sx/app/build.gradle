plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sx.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sx.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // Used by LicenseManager for local HMAC (override in local.properties for release)
        buildConfigField "String", "LICENSE_HMAC_SECRET", "\"sx-dev-hmac-secret-change-me\""
        buildConfigField "String", "SANDBOX_ENGINE", "\"blackbox\""

        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) localProps.load(localFile.newDataInputStream())

        buildConfigField "String", "LICENSE_SERVER_URL",
            "\"${localProps.getProperty('license.server_url', 'http://10.0.2.2:8000')}\""
        buildConfigField "String", "LICENSE_APP_SECRET",
            "\"${localProps.getProperty('license.app_secret', 'sx_dev_secret_2026')}\""
        // RSA public key used to verify server-issued licenses offline. The
        // matching development private key lives only in server/config.py.
        buildConfigField "String", "LICENSE_TOKEN_PUBLIC_KEY",
            "\"${localProps.getProperty('license.token_public_key', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation project(':sandbox-api')
    implementation project(':engine-bb')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Xposed / LSPosed API (compile only — provided by framework at runtime)
    compileOnly 'de.robv.android.xposed:api:82'
}
